<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find halal restaurants near you. Discover, review, and save halal spots, plus exclusive deals.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HalalMapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32"/>

  <title>HalalMapp - Find Halal Restaurants</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #0B1F3A;
    }
    /* App Store manual capture: lock to 6.5" logical frame (428×926 → 1284×2778 @3×). */
    html.appstore-capture,
    html.appstore-capture body {
      width: 428px;
      height: 926px;
      max-width: 428px;
      max-height: 926px;
      overflow: hidden;
    }
    html.appstore-capture {
      margin: 0 auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    html.appstore-capture body {
      position: relative;
    }
  </style>
  <script>
    (function () {
      if (/[?&]appstore-capture=1(?:&|$)/.test(location.search)) {
        document.documentElement.classList.add('appstore-capture');
      }
    })();
  </script>

  <!--
    Google Maps web keys are HTTP-referrer restricted. 127.0.0.1 is usually NOT
    allowlisted (localhost is). Redirect so the map key accepts this origin.
  -->
  <script>
    (function () {
      if (location.hostname === '127.0.0.1') {
        location.replace(location.href.replace('://127.0.0.1', '://localhost'));
      }
    })();
  </script>

  <!--
    Google Maps JavaScript API for web. Web map keys are necessarily public, so
    this MUST be restricted by HTTP referrer in Google Cloud. The AIzaSyBSGowMo5WllzewFQ6BGSB3xazQPXE0oks
    token is replaced at build/deploy time (see CI / deploy runbook). For local
    dev, substitute your key via ./scripts/sync_secrets.sh (from secrets.local.env).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCW1Ealt8M95qAwMxv3AY1Ib3qiH6WsLb4"></script>
  <script>
    // Google Maps calls this when the key rejects the page origin (wrong port / host).
    // Bare `flutter run -d chrome` picks a random port; Maps only allowlists localhost:52374.
    window.gm_authFailure = function () {
      var origin = location.origin;
      console.error(
        '[HalalMapp] Google Maps RefererNotAllowedMapError for ' + origin +
        '. Use ./scripts/run_web.sh (port 52374) or add this origin in GCP HTTP referrers.'
      );
      if (document.getElementById('halalmapp-maps-auth-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'halalmapp-maps-auth-banner';
      banner.setAttribute('role', 'alert');
      banner.style.cssText =
        'position:fixed;z-index:999999;left:12px;right:12px;bottom:12px;padding:14px 16px;' +
        'background:#0B1F3A;color:#fff;font:14px/1.45 system-ui,sans-serif;' +
        'border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:560px;margin:0 auto;';
      banner.innerHTML =
        '<strong style="display:block;margin-bottom:6px">Map key blocked for this URL</strong>' +
        '<span style="opacity:.9">This page is <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px">' +
        origin +
        '</code>. Google Maps only accepts the allowlisted origin (usually <code style="background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px">http://localhost:52374</code>).</span>' +
        '<div style="margin-top:10px;opacity:.95">Stop this run, then:</div>' +
        '<code style="display:block;margin-top:6px;padding:8px 10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:auto">' +
        './scripts/run_web.sh' +
        '</code>' +
        '<div style="margin-top:8px;opacity:.8;font-size:12px">Or: flutter run -d chrome --web-hostname=localhost --web-port=52374 --dart-define-from-file=env.json</div>';
      document.body.appendChild(banner);
    };

    // Flutter web does not expose clickableIcons; disable default POI info windows.
    // Do NOT force renderingType — forcing RASTER can break tiles ("Oops! Something went wrong").
    // Also default map chrome off so controls do not flash before the plugin applies options.
    (function () {
      if (typeof google === 'undefined' || !google.maps || !google.maps.Map) return;
      var OriginalMap = google.maps.Map;
      function withSafeDefaults(opts) {
        opts = opts || {};
        opts.clickableIcons = false;
        if (opts.zoomControl === undefined) opts.zoomControl = false;
        if (opts.mapTypeControl === undefined) opts.mapTypeControl = false;
        if (opts.streetViewControl === undefined) opts.streetViewControl = false;
        if (opts.fullscreenControl === undefined) opts.fullscreenControl = false;
        if (opts.scaleControl === undefined) opts.scaleControl = false;
        if (opts.rotateControl === undefined) opts.rotateControl = false;
        return opts;
      }
      google.maps.Map = function (element, opts) {
        return new OriginalMap(element, withSafeDefaults(opts));
      };
      google.maps.Map.prototype = OriginalMap.prototype;
      var setOptions = OriginalMap.prototype.setOptions;
      if (setOptions) {
        OriginalMap.prototype.setOptions = function (opts) {
          if (opts) opts.clickableIcons = false;
          return setOptions.call(this, opts);
        };
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
