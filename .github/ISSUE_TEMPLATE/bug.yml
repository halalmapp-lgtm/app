name: Bug
description: Something is broken in the app
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Assign this to whoever should fix it. Slack notifies the team on create and assignment.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      placeholder: Tapping a restaurant pin does nothing on iOS Safari.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Production web (app.halalmapp.com)
        - Preview / local
        - iOS
        - Android
        - Unsure
      default: 0
    validations:
      required: true
